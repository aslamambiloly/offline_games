name: offline_games
description: A plug-and-play mini arcade for Flutter apps when the device goes offline. Zero-config, dependency-free games, with author credits.
version: 0.1.0
homepage: https://github.com/aslamambiloly/offline_games
repository: https://github.com/aslamambiloly/offline_games
issue_tracker: https://github.com/aslamambiloly/offline_games/issues
topics:
  - games
  - offline
  - arcade
  - connectivity
  - widgets

environment:
  sdk: ^3.3.0
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  internet_connection_checker_plus: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
